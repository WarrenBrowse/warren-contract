name: CI

# Runs on GitHub-hosted runners: free and unlimited for a public repo, and
# faster than the self-hosted pools were.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

concurrency:
  # Cancel superseded runs on the same ref so a burst of pushes does not burn
  # runner time on commits nobody will look at.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anti-refrag:
    name: anti-refragmentation gate
    # Only same-repo events reach this job, a guard kept from the self-hosted era.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The gate's offline `cargo metadata --no-deps` resolves the [patch] to the
      # sibling engine, so clone it (same step as the checks job).
      - name: checkout warrenguard engine
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          REV="$(tr -d '[:space:]' < .warrenguard-version)"
          if [ -n "${ENGINE_TOKEN:-}" ]; then
            URL="https://x-access-token:${ENGINE_TOKEN}@github.com/WarrenBrowse/warrenguard.git"
          else
            URL="https://github.com/WarrenBrowse/warrenguard.git"
          fi
          rm -rf ../warrenguard
          git clone --quiet "${URL}" ../warrenguard
          git -C ../warrenguard checkout --quiet "${REV}"
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: single-home dependency-direction gate
        run: bash scripts/ci/anti-refrag.sh

  checks:
    name: fmt + clippy + test
    # Only same-repo events reach this job, a guard kept from the self-hosted era.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The test binaries replay the shared golden vectors (warren-vectors),
      # checked out as the `vectors/` submodule.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The root [patch] redirects the pinned warrenguard git deps to the
      # sibling checkout, so CI clones it there at `.warrenguard-version`.
      # ENGINE_TOKEN (Contents:read on WarrenBrowse/warrenguard) is optional;
      # without it the clone falls back to anonymous HTTPS (the engine is public).
      - name: checkout warrenguard engine
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          REV="$(tr -d '[:space:]' < .warrenguard-version)"
          echo "==> warrenguard engine pinned at ${REV}"
          if [ -n "${ENGINE_TOKEN:-}" ]; then
            URL="https://x-access-token:${ENGINE_TOKEN}@github.com/WarrenBrowse/warrenguard.git"
          else
            URL="https://github.com/WarrenBrowse/warrenguard.git"
          fi
          rm -rf ../warrenguard
          git clone --quiet "${URL}" ../warrenguard
          git -C ../warrenguard checkout --quiet "${REV}"
          echo "==> warrenguard checked out at $(git -C ../warrenguard rev-parse --short HEAD)"
      # The [workspace.dependencies] git revs must equal .warrenguard-version:
      # CI builds against the sibling clone at that rev via [patch], so a
      # drifted rev would ship a declared dependency nobody tested.
      - name: check warrenguard pin lockstep
        run: |
          set -euo pipefail
          REV="$(tr -d '[:space:]' < .warrenguard-version)"
          MISMATCH="$(grep -E 'warrenguard.*\brev = "' Cargo.toml | grep -v "rev = \"${REV}\"" || true)"
          if [ -n "${MISMATCH}" ]; then
            echo "Cargo.toml warrenguard rev diverges from .warrenguard-version (${REV}):"
            echo "${MISMATCH}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `seal` (attribution tag sealing, warren-api only) is off for every
      # other consumer, so lint and test both shapes: the sealing replay of
      # vectors/pf_attribution.json only runs with it on.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      # The workspace denies rustdoc::broken_intra_doc_links; only a doc build
      # exercises that lint, so run one with warnings promoted.
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
