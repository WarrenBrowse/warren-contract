name: CI

# Runs exclusively on the WarrenBrowse org self-hosted runners (same policy as
# warren-sdk-rs; verification only, so it runs on the native arm64 Linux fleet,
# not the wedge-prone x86-under-Rosetta containers). Do not switch to a
# GitHub-hosted runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

concurrency:
  # A single self-hosted Linux runner serves these jobs; cancel superseded runs
  # on the same ref so a burst of pushes cannot pile up a serial backlog.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt + clippy + test
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The root [patch] redirects the pinned warrenguard git deps to the
      # sibling checkout, so CI clones it there at `.warrenguard-version`.
      # ENGINE_TOKEN (repo PAT with Contents:read on WarrenBrowse/warrenguard)
      # is optional: the org is on the free plan, so org-level secrets do not
      # reach private repos. Without it we fall back to SSH, which the
      # self-hosted runner already holds org credentials for (it fetches the
      # warren-quinn ssh git dep for warren-sdk-rs the same way).
      - name: checkout warrenguard engine
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          REV="$(tr -d '[:space:]' < .warrenguard-version)"
          echo "==> warrenguard engine pinned at ${REV}"
          if [ -n "${ENGINE_TOKEN:-}" ]; then
            URL="https://x-access-token:${ENGINE_TOKEN}@github.com/WarrenBrowse/warrenguard.git"
          else
            URL="git@github.com:WarrenBrowse/warrenguard.git"
          fi
          rm -rf ../warrenguard
          # cargo ships GitHub's host key built in but plain git does not, so
          # pin-on-first-use here instead of failing on an empty known_hosts.
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
          git clone --quiet "${URL}" ../warrenguard
          git -C ../warrenguard checkout --quiet "${REV}"
          echo "==> warrenguard checked out at $(git -C ../warrenguard rev-parse --short HEAD)"
      # The [workspace.dependencies] git revs must equal .warrenguard-version:
      # CI builds against the sibling clone at that rev via [patch], so a
      # drifted rev would ship a declared dependency nobody tested.
      - name: check warrenguard pin lockstep
        run: |
          set -euo pipefail
          REV="$(tr -d '[:space:]' < .warrenguard-version)"
          MISMATCH="$(grep -E 'warrenguard.*\brev = "' Cargo.toml | grep -v "rev = \"${REV}\"" || true)"
          if [ -n "${MISMATCH}" ]; then
            echo "Cargo.toml warrenguard rev diverges from .warrenguard-version (${REV}):"
            echo "${MISMATCH}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The workspace denies rustdoc::broken_intra_doc_links; only a doc build
      # exercises that lint, so run one with warnings promoted.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
