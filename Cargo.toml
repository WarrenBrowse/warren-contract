[package]
name = "warren-contract"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Warren client<->server contract: the SS58 identity codec and the HTTP /v1 API DTOs. Single source of truth shared by the client SDK and the backend, so the wire contract cannot drift between them."
repository = "https://github.com/WarrenBrowse/warren-contract"
publish = false

[workspace]
members = ["warren-discovery"]

[workspace.dependencies]
# WarrenGuard engine crates. Declared as GIT deps pinned to the rev in
# `.warrenguard-version` so warren-contract is self-resolving when consumed as a
# git dependency (a path dep pointing outside the repo cannot resolve there, and
# a consumer's [patch] does not apply to path-sourced deps). Local dev and CI
# override these with the sibling `../warrenguard` via the `[patch]` at the foot
# of this file. Keep the rev in lockstep with `.warrenguard-version`.
warrenguard-wire = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "c8f1627793592ba0b6f9a610c9cb4235134add19" }
warrenguard-multihop = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "c8f1627793592ba0b6f9a610c9cb4235134add19" }
# Dev-only: anchors the entitlement envelope's token length on the engine's.
warrenguard-token = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "c8f1627793592ba0b6f9a610c9cb4235134add19" }

# Lints applied to every crate in the workspace via `[lints] workspace = true`.
# Mirrors warren-sdk-rs / warren-core policy: zero unsafe, deny correctness,
# document the public surface.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
# A broken doc link is a silent rot: deny it so a renamed symbol fails the doc
# build instead of shipping a dead reference.
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
must_use_candidate = "warn"
needless_pass_by_value = "warn"

[lints]
workspace = true

[dependencies]
bs58 = "0.5"
blake2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# For ExitId, re-exported by the /v1 DTOs.
warrenguard-wire = { workspace = true }
# The X-Warren request-signing procedure (client side) lives here so the SDK
# and the backend cannot drift on how a signature is computed, not only on the
# canonical message.
ed25519-dalek = { version = "2", features = ["zeroize", "rand_core"] }
sha2 = "0.10"
hex = "0.4"
# Canonical signature preimage of the signed release manifest.
serde_json = "1"
# Wire form of the port-forward attribution tag in the /v1 DTOs (base64url,
# no padding, like the blind signatures it travels beside).
base64 = "0.22"
# Wipes the entitlement a parsed envelope holds (a bearer credential).
# Already in every consumer's graph through ed25519-dalek's `zeroize`.
zeroize = "1"
# Sealing and opening an attribution tag, behind `seal` (see below).
chacha20poly1305 = { version = "0.10", default-features = false, optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[features]
# Minting and opening port-forward attribution tags. Only warren-api holds
# the keys that need it, so the SDK, the exit and every other consumer build
# without the AEAD: they parse and verify a tag, they never seal or open one.
seal = ["dep:chacha20poly1305", "dep:rand_core"]

[dev-dependencies]
warrenguard-token = { workspace = true }

# Local-dev / CI override: resolve the WarrenGuard engine crates from the
# sibling checkout (`../warrenguard`) instead of fetching the pinned git rev in
# `[workspace.dependencies]`. CI clones warrenguard there at
# `.warrenguard-version`; local dev has it as a mani-workspace sibling. The git
# deps keep this repo self-resolving for a downstream consumer with no sibling
# (it simply does not inherit this patch). Mirror any add/remove in
# `[workspace.dependencies]` above.
[patch."https://github.com/WarrenBrowse/warrenguard.git"]
warrenguard-wire = { path = "../warrenguard/crates/warrenguard-wire" }
warrenguard-multihop = { path = "../warrenguard/crates/warrenguard-multihop" }
warrenguard-token = { path = "../warrenguard/crates/warrenguard-token" }
