[package]
name = "warren-contract"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Warren client<->server contract: the SS58 identity codec and the HTTP /v1 API DTOs. Single source of truth shared by the client SDK and the backend, so the wire contract cannot drift between them."
repository = "https://github.com/WarrenBrowse/warren-contract"
publish = false

[workspace]
members = ["warren-discovery"]

[workspace.dependencies]
# WarrenGuard engine crates. Declared as GIT deps pinned to the rev in
# `.warrenguard-version` so warren-contract is self-resolving when consumed as a
# git dependency (a path dep pointing outside the repo cannot resolve there, and
# a consumer's [patch] does not apply to path-sourced deps). Local dev and CI
# override these with the sibling `../warrenguard` via the `[patch]` at the foot
# of this file. Keep the rev in lockstep with `.warrenguard-version`.
warrenguard-wire = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "906ddc75a7a33a17ef744cf0b486e6ed4bc4ff4e" }
warrenguard-multihop = { git = "https://github.com/WarrenBrowse/warrenguard.git", rev = "906ddc75a7a33a17ef744cf0b486e6ed4bc4ff4e" }

[dependencies]
bs58 = "0.5"
blake2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# For ExitId, re-exported by the /v1 DTOs.
warrenguard-wire = { workspace = true }
# The X-Warren request-signing procedure (client side) lives here so the SDK
# and the backend cannot drift on how a signature is computed, not only on the
# canonical message.
ed25519-dalek = { version = "2", features = ["zeroize", "rand_core"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_json = "1"

# Local-dev / CI override: resolve the WarrenGuard engine crates from the
# sibling checkout (`../warrenguard`) instead of fetching the pinned git rev in
# `[workspace.dependencies]`. CI clones warrenguard there at
# `.warrenguard-version`; local dev has it as a mani-workspace sibling. The git
# deps keep this repo self-resolving for a downstream consumer with no sibling
# (it simply does not inherit this patch). Mirror any add/remove in
# `[workspace.dependencies]` above.
[patch."https://github.com/WarrenBrowse/warrenguard.git"]
warrenguard-wire = { path = "../warrenguard/crates/warrenguard-wire" }
warrenguard-multihop = { path = "../warrenguard/crates/warrenguard-multihop" }
